name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m build
      - run: python -c "import zipfile; from pathlib import Path; wheel=next(Path('dist').glob('*.whl')); assert 'chemelex_nuheat/py.typed' in zipfile.ZipFile(wheel).namelist()"
