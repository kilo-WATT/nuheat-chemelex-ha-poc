[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chemelex-nuheat"
version = "0.1.0"
description = "Typed async client for the Chemelex NuHeat OpenAPI v2"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "kilo-WATT" }]
keywords = ["chemelex", "nuheat", "thermostat", "aiohttp", "home-assistant"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["aiohttp>=3.11,<4"]

[project.urls]
Repository = "https://github.com/kilo-WATT/nuheat-chemelex-ha-poc"
Issues = "https://github.com/kilo-WATT/nuheat-chemelex-ha-poc/issues"
Documentation = "https://api.nam.mynuheat.com/"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.15",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-homeassistant-custom-component==0.13.346",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chemelex_nuheat"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/src/chemelex_nuheat",
  "/tests/test_client.py",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["chemelex_nuheat", "custom_components"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/chemelex_nuheat"]
show_error_codes = true

[[tool.mypy.overrides]]
module = "aiohttp.*"
follow_untyped_imports = true
